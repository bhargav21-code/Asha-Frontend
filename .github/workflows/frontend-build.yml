name: Frontend build check

on:
  push:
    branches:
      - main
      - security-frontend-compatibility
  pull_request:
    branches:
      - main
      - security-hardening

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --include=dev
      - name: Build frontend
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Report build-tool dependency advisories
        continue-on-error: true
        run: npm audit
