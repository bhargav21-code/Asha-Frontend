name: Frontend build check

on:
  push:
    branches:
      - main
      - security-frontend-compatibility
  pull_request:
    branches:
      - main
      - security-hardening

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --include=dev
      - name: Apply non-breaking npm security updates
        run: npm audit fix || true
      - name: Commit updated dependency lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: apply non-breaking npm security updates"
            git fetch origin "${HEAD_BRANCH}"
            git rebase "origin/${HEAD_BRANCH}"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
      - name: Verify clean lockfile install
        run: npm ci --include=dev
      - name: Build frontend
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev
